[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cross_dex"
version = "0.2.0"
description = "cross-dex: VR teleoperation (Manus gloves + Meta Quest 3), cross-embodiment retargeting and the data pipeline shared by the DexVerse and Bench2Dex benchmarks"
requires-python = ">=3.10"
# Core (teleop/common, devices/manus, retarget) needs numpy / scipy; finger retargeting needs dex_retargeting
# (+ pinocchio); the Isaac Lab device, the Quest OpenXR input and the calibration apps need Isaac Sim / Isaac Lab;
# the DexVerse adapters need the dexverse package. They are not declared so the package installs into an
# existing simulator environment:  pip install --no-deps -e /workspace/cross_dex
dependencies = ["numpy", "scipy"]

[tool.setuptools.packages.find]
include = ["cross_dex*"]

[tool.setuptools.package-data]
"cross_dex.teleop.retarget" = ["angle_cfgs/*.yml"]
"cross_dex.teleop.retarget.bench2dex" = ["hand_cfgs/*.yml", "hand_cfgs/*/urdf/*.urdf"]
"cross_dex.teleop.tools.hand_viewer" = ["*.html"]
"cross_dex.dataset.chunk_paired" = ["*.html"]
